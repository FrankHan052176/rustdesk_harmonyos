name: Flutter Release Build

# CI builds only an unsigned Release OpenHarmony HAP (no signing secrets and no AppGallery Connect
# upload live in GitHub Actions). Pushing to `ohos-port` produces the `rustdesk-flutter-ohos-hap`
# artifact automatically for local AGCD to download, sign and distribute; manual `workflow_dispatch`
# additionally allows overriding the stamped version or publishing the unsigned HAP as a GitHub
# prerelease. The other platforms stay parked in flutter-build.yml.
on:
  push:
    branches:
      - ohos-port
  workflow_dispatch:
    inputs:
      publish-release:
        description: "Publish the GitHub prerelease carrying the unsigned HAP"
        type: boolean
        default: false
      version:
        description: "Version stamped into the artifact file names"
        type: string
        default: "1.5.0"

concurrency:
  group: flutter-release
  cancel-in-progress: false

jobs:
  # The gate that caught the dependency regression: the committed pubspec has to stay on the
  # values every leg resolves, so it runs before anything is built or submitted.
  verify-dependency-state:
    name: Verify the committed dependency state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify the dependency selection
        shell: bash
        run: |
          python3 scripts/test_prepare_ohos_flutter.py
          python3 scripts/prepare-ohos-flutter.py --check

  build-and-release:
    needs: verify-dependency-state
    uses: ./.github/workflows/flutter-ohos.yml
    # The called workflow declares the token it needs: contents: write, for the prerelease a run
    # can be asked to publish. Asking for it on the job that calls it keeps that request explicit
    # instead of inheriting whatever default the repository's Actions settings carry, which a
    # fresh fork has not proven; the dependency gate above keeps the narrower default.
    permissions:
      contents: write
    with:
      upload-artifact: true
      # A push only uploads the unsigned HAP artifact for AGCD; a GitHub prerelease is published
      # only when explicitly ticked on a manual workflow_dispatch form.
      publish-release: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish-release == 'true' }}
      upload-tag: "nightly"
      version: ${{ github.event.inputs.version || '1.5.0' }}
